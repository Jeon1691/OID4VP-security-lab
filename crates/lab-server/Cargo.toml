[package]
name = "lab-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Wallet simulator (IMP-010): fetches request objects and seals HPKE-0 responses. Enables
# jose-hpke's sender-side `test-support`, so the default (Verifier) build never contains
# sealing code. Tests enable it through the self dev-dependency below.
# It also verifies signed Request Objects with ssi (did:key resolution, ES256), which is
# therefore never in the default build either.
# With `ecdh-es-research` also on, it seals ECDH-ES responses too (`jose-ecdh-es?/test-support`:
# the `?` adds the feature only where jose-ecdh-es is already a dependency, so `wallet-sim` alone
# never pulls jose-ecdh-es in).
wallet-sim = ["dep:reqwest", "dep:ssi", "jose-hpke/test-support", "jose-ecdh-es?/test-support"]
# Research instrumentation (`LabServer::pause_decryptions` / `parked_trials`): an in-process
# lever that halts decryption, for deterministic race and shutdown scenarios. Never in the
# default (Verifier) build; tests enable it through the self dev-dependency.
lab-instrumentation = []
# OpenID4VP 1.0-style ECDH-ES research route (docs/adr/0001-ecdh-es-research-route.md):
# `POST /lab/v1/response/ecdh-es`, one ECDH-ES P-256 key and `kid` shared by every session on it,
# served in research mode only and never a fallback for the HPKE-0 routes. Off by default, so the
# default (Verifier) build and the binary contain no ECDH-ES code; it enables jose-ecdh-es
# without `test-support` (opening only). Tests enable it through the self dev-dependency.
ecdh-es-research = ["dep:jose-ecdh-es"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
form_urlencoded = { workspace = true }
getrandom = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
jose-ecdh-es = { workspace = true, optional = true }
jose-hpke = { workspace = true }
p256 = { workspace = true }
protocol-model = { workspace = true }
reqwest = { workspace = true, optional = true }
# Duplicate-member check of every JWT header, payload and Disclosure (a `Visitor`; no derive).
serde = { workspace = true }
serde_json = { workspace = true }
session-core = { workspace = true }
sha2 = { workspace = true }
ssi = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"] }
zeroize = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
# Interop test (tests/ecdh_es_spruce_jwe_interop.rs) opens SpruceID's ECDH-ES responses with it
# directly. No `test-support` here; the default Verifier build does not depend on jose-ecdh-es.
jose-ecdh-es = { workspace = true }
josekit = { workspace = true }
# Self dev-dependency: integration tests drive the server with the wallet simulator.
lab-server = { path = ".", features = ["wallet-sim", "lab-instrumentation", "ecdh-es-research"] }
openid4vp = { workspace = true }
p256-spruce = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
ssi = { workspace = true }
tokio = { workspace = true, features = ["net"] }
uuid = { workspace = true }

[lints]
workspace = true
