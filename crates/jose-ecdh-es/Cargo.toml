[package]
name = "jose-ecdh-es"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Sender-side sealing and the key-derivation hooks of the RFC 7518 Appendix C known-answer tests
# (`test_support`). For fixtures and the wallet simulator only; the Verifier must not enable it.
test-support = []

[dependencies]
aes-gcm = { workspace = true }
base64 = { workspace = true }
p256 = { workspace = true }
protocol-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
getrandom = { workspace = true }
# Interoperability tests only: josekit (the same git rev SpruceID openid4vp encrypts with) and
# the p256 0.13 curve type its ECDH-ES API is generic over. Never a normal dependency.
josekit = { workspace = true }
p256-spruce = { workspace = true }
# Self dev-dependency: this crate's own tests always build with `test-support`.
jose-ecdh-es = { path = ".", features = ["test-support"] }

[lints]
workspace = true
