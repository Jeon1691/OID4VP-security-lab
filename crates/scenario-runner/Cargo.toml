[package]
name = "scenario-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# G6 benchmark driver (IMP-015): an in-process lab-server over real loopback HTTP, driven by the
# wallet simulator, plus session-store timings (memory vs Redis). A research tool, never part
# of the Verifier build: it enables lab-server's `wallet-sim` (sealing, ssi) for itself only;
# `cargo build -p lab-server` / `cargo tree -p lab-server` stay without it.
[dependencies]
anyhow = { workspace = true }
evidence-report = { workspace = true }
hdrhistogram = { workspace = true }
# `lab-instrumentation`: the decryption pause that holds requests in the pipeline, so the
# in-flight cap is exercised under controlled admission (http::in_flight_cap).
lab-server = { workspace = true, features = ["wallet-sim", "lab-instrumentation"] }
protocol-model = { workspace = true }
redis = { workspace = true }
serde_json = { workspace = true }
session-core = { workspace = true }
session-redis = { workspace = true }
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
criterion = { workspace = true }
getrandom = { workspace = true }
# Sealing for the HPKE-open benchmark input (sender side, test-only).
jose-hpke = { workspace = true, features = ["test-support"] }

# HPKE-0 open and session resolution per strategy and N. `test = true`: `cargo test` also
# builds it and runs every benchmark once (criterion's test mode, no measurement), so the gate
# exercises the benches and cargo sees criterion used by a built target.
[[bench]]
name = "micro"
harness = false
test = true

[lints]
workspace = true
