# PR / main gate (Notion 04 · CI §2-4, CI-001/CI-002).
# Jobs call scripts/ci_local.sh stages, so CI and `make gate` run identical steps.
# Only implemented checks exist here; later gates (HPKE vectors, HTTP E2E, Redis) get their own
# jobs when their tests exist (no placeholder jobs).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job needs to write to the repository. Never use pull_request_target here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  EVIDENCE_DIR: ci-evidence
  # PR evidence retention proposed in Notion 04 · CI §8.
  EVIDENCE_RETENTION_DAYS: 14
  # Tool versions match the ones recorded in evidence/g0/manifest.json.
  CARGO_DENY: cargo-deny@0.20.2
  CARGO_AUDIT: cargo-audit@0.23.0
  CARGO_MACHETE: cargo-machete@0.10.1
  SHELLCHECK: shellcheck@0.11.0
  # actionlint is not packaged by install-action; fetch the official release and verify it
  # against the SHA-256 published in actionlint_1.7.12_checksums.txt.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  quality:
    name: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ env.CARGO_MACHETE }},${{ env.SHELLCHECK }}
      - name: Install actionlint (checksum-verified release)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/actionlint" "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" -version
      - run: scripts/ci_local.sh "$EVIDENCE_DIR" quality
      - if: always()
        run: scripts/evidence_manifest.sh "$EVIDENCE_DIR"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-rust-quality
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: error

  test:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/ci_local.sh "$EVIDENCE_DIR" test
      - if: always()
        run: scripts/evidence_manifest.sh "$EVIDENCE_DIR"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-unit
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: error

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -Vv
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ env.CARGO_DENY }},${{ env.CARGO_AUDIT }}
      - run: scripts/ci_local.sh "$EVIDENCE_DIR" supply-chain
      - if: always()
        run: scripts/evidence_manifest.sh "$EVIDENCE_DIR"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-supply-chain
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: error

  # G0-A/B evidence: upstream SpruceID CI reproduced at the pinned SHA. The pin does not change
  # per PR, so this runs on main / manual dispatch only and is not part of ci-gate.
  g0-upstream:
    name: g0-upstream
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: upstream/openid4vp
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ env.CARGO_DENY }},${{ env.CARGO_MACHETE }}
      - run: scripts/g0_upstream.sh "$EVIDENCE_DIR"
      - if: always()
        run: scripts/evidence_manifest.sh "$EVIDENCE_DIR"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-g0-upstream
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
          if-no-files-found: error

  # Single required check. Runs even when dependencies fail or are skipped, and only passes if
  # every gate job actually succeeded: GitHub reports skipped jobs as success, so check results.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [quality, test, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require success from every gate job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$NEEDS" | jq -e '
            ["quality", "test", "supply-chain"] as $required
            | . as $n
            | $required | all(. as $j | $n[$j].result == "success")
          ' >/dev/null
