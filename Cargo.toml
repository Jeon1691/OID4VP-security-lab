[workspace]
resolver = "3"
# MVP scope (06 · Design Review §6): four packages only. spruce-adapter, session-redis,
# scenario-runner and evidence-report are split out only after the G0/G1 gates pass.
members = [
    "crates/protocol-model",
    "crates/jose-hpke",
    "crates/session-core",
    "crates/lab-server",
]
# Pinned upstream checkout for G0 reproduction (scripts/g0_upstream.sh); built standalone.
exclude = ["upstream"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# Shared version pins. A crate opts in with `dep = { workspace = true }`; cargo warns on unused
# workspace entries, so only dependencies already in use live in this table.
[workspace.dependencies]
# SpruceID OpenID4VP, pinned to the commit analysed in the 02/03 design docs (ADR-001).
openid4vp = { git = "https://github.com/spruceid/openid4vp", rev = "c57a895884d039a741cc4b472c1698fb147ba487" }
# Must match the versions openid4vp itself depends on, so key/DID types are interchangeable.
ssi = { version = "0.16", features = ["secp256r1"] }
p256-spruce = { package = "p256", version = "0.13.2", features = ["jwk"] }
uuid = { version = "1.29.3", features = ["v4"] }
# Same git source/rev as openid4vp's own josekit, so the lab decrypts with the JWE code SpruceID
# encrypts with (ECDH-ES only). Used by the G0-D verifier-side decryption.
josekit = { git = "https://github.com/cobward/josekit-rs", rev = "635c8a7" }
# Same 0.12 line openid4vp already pulls in (no new crates). Tests build their own client so
# they can force `no_proxy` and keep every request on loopback.
reqwest = { version = "0.12.28", default-features = false }
# Required to implement openid4vp's `#[async_trait]` traits (Wallet, RequestVerifier, ...).
async-trait = "0.1.92"

anyhow = "1.0.105"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
form_urlencoded = "1.2.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2.0.21"

# Workspace crates.
protocol-model = { path = "crates/protocol-model" }

# jose-hpke (S1). HPKE-0 = DHKEM(P-256, HKDF-SHA256) + HKDF-SHA256 + AES-128-GCM. Defaults pull
# X25519/ML-KEM/ChaCha, which HPKE-0 does not need. Uses p256 0.14 (openid4vp: 0.13).
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "nistp", "aes", "hkdfsha2"] }
# Only the Deserialize/Visitor traits are used (duplicate-member check); no derive needed.
serde = "1.0.229"
# Test-only OS RNG for jose-hpke seal round trips; implements the rand_core 0.10 traits hpke takes.
getrandom = { version = "0.4.3", default-features = false, features = ["sys_rng"] }

# Vetted for upcoming sprints (compile-probed on rustc 1.100.0, 2026-11-23); move into the table
# above when a crate first uses them.
#   S2 lab-server: tower = "0.5", tracing = "0.1.44", url = "2.5.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No placeholder implementations may slip through as "done" (04 · CI §1).
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
debug = "line-tables-only"
