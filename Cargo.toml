[workspace]
resolver = "3"
# MVP scope (06 · Design Review §6) was four packages; session-redis (G5, IMP-014) is split out
# now that G0/G1 have passed, scenario-runner and evidence-report (G6, IMP-015/016) after the
# MVP. jose-ecdh-es (OpenID4VP 1.0-style ECDH-ES codec, research only; never a fallback for
# jose-hpke) is a plain library like jose-hpke. spruce-adapter follows later.
members = [
    "crates/protocol-model",
    "crates/jose-hpke",
    "crates/jose-ecdh-es",
    "crates/session-core",
    "crates/session-redis",
    "crates/lab-server",
    "crates/evidence-report",
    "crates/scenario-runner",
]
# Everything but scenario-runner: it enables lab-server's test-only `wallet-sim` (sealing, ssi)
# as a normal dependency, so building it next to lab-server unifies that feature into the
# lab-server binary. A plain `cargo build` / `cargo run` at the root therefore stays a Verifier
# build; the benchmark is built explicitly (`-p scenario-runner`, `--workspace`).
default-members = [
    "crates/protocol-model",
    "crates/jose-hpke",
    "crates/jose-ecdh-es",
    "crates/session-core",
    "crates/session-redis",
    "crates/lab-server",
    "crates/evidence-report",
]
# Pinned upstream checkout for G0 reproduction (scripts/g0_upstream.sh); built standalone.
exclude = ["upstream"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# Shared version pins. A crate opts in with `dep = { workspace = true }`; cargo warns on unused
# workspace entries, so only dependencies already in use live in this table.
[workspace.dependencies]
# SpruceID OpenID4VP, pinned to the commit analysed in the 02/03 design docs (ADR-001).
openid4vp = { git = "https://github.com/spruceid/openid4vp", rev = "c57a895884d039a741cc4b472c1698fb147ba487" }
# Must match the versions openid4vp itself depends on, so key/DID types are interchangeable.
ssi = { version = "0.16", features = ["secp256r1"] }
p256-spruce = { package = "p256", version = "0.13.2", features = ["jwk"] }
uuid = { version = "1.29.3", features = ["v4"] }
# Same git source/rev as openid4vp's own josekit, so the lab decrypts with the JWE code SpruceID
# encrypts with (ECDH-ES only). Used by the G0-D verifier-side decryption.
josekit = { git = "https://github.com/cobward/josekit-rs", rev = "635c8a7" }
# Same 0.12 line openid4vp already pulls in (no new crates). Tests build their own client so
# they can force `no_proxy` and keep every request on loopback.
reqwest = { version = "0.12.28", default-features = false }
# Required to implement openid4vp's `#[async_trait]` traits (Wallet, RequestVerifier, ...).
async-trait = "0.1.92"

# Property tests for the session state machine. Defaults pull rusty-fork/tempfile (fork and
# timeout runners), which in-process tests do not need.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

anyhow = "1.0.105"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
form_urlencoded = "1.2.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2.0.21"

# lab-server accept loop (header read timeout needs a hyper timer, which `axum::serve` does not
# set). Both are already in the tree through axum and reqwest; these entries only name the
# features lab-server uses. `server-graceful` adds no crate (it needs only tokio's `sync`).
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server-graceful", "service", "tokio"] }

# lab-server Request Object signing (JAR, ES256). Same 0.14 line hpke already uses (p256 0.14 ->
# crypto-bigint 0.7, no advisories); `ecdsa` adds the RustCrypto ecdsa 0.17 / rfc6979 /
# signature crates. SpruceID's `P256Signer` is not used in the Verifier build: it would pull
# openid4vp (and with it reqwest, ssi and the advisory baseline) into the shipped binary, and its
# p256 0.13 line signs over crypto-bigint 0.5 (RUSTSEC-2026-0387). Tests pin byte equality.
# `ecdh` (jose-ecdh-es key agreement) is the feature hpke already enables on the same p256, so
# it adds no crate.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh"] }

# lab-server did:key derivation of the Request Object signing key (base58btc, did:key v0.7).
# Already in the tree through ssi; `alloc` only (no `check`, so no extra sha2).
bs58 = { version = "0.4.0", default-features = false, features = ["alloc"] }
# Wipes the signing key JWK file buffer and decoded `d`. Already in the tree (p256, hpke).
zeroize = "1.9.2"

# SHA-256 for the lab-server response digest (session-core `ResponseDigest`). Same 0.11 line
# hpke's HKDF already pulls in, so no new crate enters the tree; `oid` is not needed.
sha2 = { version = "0.11.1", default-features = false }

# lab-server `conformance` feature only (docs/adr/0002-conformance-mode.md): HTTPS on loopback
# and X.509 client identifiers. All three are already in the tree (reqwest's rustls stack under
# openid4vp / ssi), so no new crate enters Cargo.lock. Defaults are off: the ring provider only
# (no aws-lc-rs / aws-lc-sys in the conformance build), TLS 1.3 only (no `tls12`), no `log`.
# rustls-webpki verifies the leaf against the trust anchor, its SAN and its key at start.
# Licenses: rustls Apache-2.0 OR ISC OR MIT, tokio-rustls MIT OR Apache-2.0, rustls-webpki ISC,
# ring Apache-2.0 AND ISC.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
# Renamed to its library name `webpki`, which is what the code (and cargo-machete) sees.
webpki = { package = "rustls-webpki", version = "0.103.17", default-features = false, features = ["ring", "std"] }

# lab-server `conformance` feature only: zlib inflation of Token Status Lists
# (draft-ietf-oauth-status-list-14 §4.1 step 4, §8.3 step 5) with an output bound. Already in the
# tree (flate2 under reqwest / ssi), so no new crate enters Cargo.lock. `with-alloc` (the
# default) is what `decompress_to_vec_zlib_with_limit` needs; no `std`, no `simd`.
# MIT OR Zlib OR Apache-2.0 (adler2: 0BSD OR MIT OR Apache-2.0).
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

# Workspace crates.
protocol-model = { path = "crates/protocol-model" }
jose-hpke = { path = "crates/jose-hpke" }
jose-ecdh-es = { path = "crates/jose-ecdh-es" }
session-core = { path = "crates/session-core" }
session-redis = { path = "crates/session-redis" }
lab-server = { path = "crates/lab-server" }
evidence-report = { path = "crates/evidence-report" }

# scenario-runner (G6, IMP-015): latency percentiles. Defaults add `serialization` (flate2, nom,
# base64 for the histogram wire format) and `sync` (crossbeam-channel); the runner only records
# and reads quantiles in one thread, so neither is needed (leaves only num-traits).
# MIT OR Apache-2.0.
hdrhistogram = { version = "7.6.0", default-features = false }
# scenario-runner micro-benchmarks (`benches/`, dev-dependency only). Defaults add rayon and
# plotters (parallel analysis, SVG/HTML charts); text output needs neither. Apache-2.0 OR MIT.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# session-redis (G5, IMP-014). Async client on the tokio runtime the lab-server already uses;
# defaults (acl, streams, geospatial, num-bigint) are not needed. `script` = EVALSHA with
# NOSCRIPT reload, `connection-manager` = reconnect after a Redis restart (every call while
# disconnected still fails; there is no fallback store). BSD-3-Clause.
redis = { version = "1.8.3", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }

# jose-hpke (S1). HPKE-0 = DHKEM(P-256, HKDF-SHA256) + HKDF-SHA256 + AES-128-GCM. Defaults pull
# X25519/ML-KEM/ChaCha, which HPKE-0 does not need. Uses p256 0.14 (openid4vp: 0.13).
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "nistp", "aes", "hkdfsha2"] }
# jose-ecdh-es: AES-GCM content encryption (RFC 7518 §5.3). The same aes-gcm 0.11.1 hpke already
# pulls in (one version, no new crate). `zeroize` wipes the expanded AES key schedule and GHASH
# key on drop; it only switches on features of crates already in the tree. Apache-2.0 OR MIT.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
# jose-hpke: Deserialize/Visitor (duplicate-member check). session-redis: the Serialize /
# DeserializeOwned bound on stored results. No derive needed.
serde = "1.0.229"
# OS RNG. jose-hpke: test-only seal round trips (`sys_rng` implements the rand_core 0.10 traits
# hpke takes). session-core: route tokens via `getrandom::fill`. One entry, one version.
getrandom = { version = "0.4.3", default-features = false, features = ["sys_rng"] }

# Vetted for upcoming sprints (compile-probed on rustc 1.100.0, 2026-11-23); move into the table
# above when a crate first uses them.
#   S2 lab-server: tower = "0.5", tracing = "0.1.44", url = "2.5.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No placeholder implementations may slip through as "done" (04 · CI §1).
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
debug = "line-tables-only"
